name: Prod EE Build

on:
  push:
    branches:
      - main
    paths:
      - '**/execution-environment.yml'
      - '.github/ee-projects.json'
      - '.github/scripts/ee_projects.py'
      - '.github/workflows/generate_matrix.py'
      - '**/requirements.txt'
      - '**/requirements.yml'
      - '**/bindep.txt'
      - '**/customize.sh'
      - '**/ansible.cfg'
      - '**/ansible-collections.yml'
      - '**/python-packages.txt'
      - '**/system-packages.txt'
  workflow_dispatch:
    inputs:
      ee_name:
        description: 'EE directory to build (e.g. dcm-bootstrap-ee, dcm-base-ee)'
        required: true
        default: 'dcm-bootstrap-ee'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      length: ${{ steps.set-matrix.outputs.length }}
      ocp_matrix: ${{ steps.ocp-matrix.outputs.matrix }}
      ocp_length: ${{ steps.ocp-matrix.outputs.length }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        fetch-depth: 0

    - name: Generate matrix (push)
      id: generate-matrix
      if: github.event_name == 'push'
      working-directory: ${{ github.workspace }}
      run: |
        python -u .github/workflows/generate_matrix.py \
        --start-ref $(git rev-parse HEAD^1) \
        --end-ref $(git rev-parse HEAD) \
        --output matrix_output.json

    - name: Generate matrix (workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      working-directory: ${{ github.workspace }}
      env:
        EE_NAME: ${{ inputs.ee_name }}
      run: |
        if python3 -c 'import json, os, sys; streams = json.load(open(".github/ocp-ee-streams.json"))["streams"]; sys.exit(0 if os.environ["EE_NAME"] in {"dcm-ocp-ee-" + stream for stream in streams} else 1)'; then
          echo "Use Versioned OpenShift EE Build for this image." >&2
          exit 1
        fi
        python3 .github/scripts/ee_projects.py matrix --project "$EE_NAME" > matrix_output.json

    - name: Prepare dependent OpenShift stream matrix
      id: ocp-matrix
      run: |
        MATRIX=$(python3 .github/scripts/ocp_ee.py automation-matrix)
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
        MATRIX_LENGTH=$(printf '%s' "$MATRIX" | jq '.include | length')
        echo "length=$MATRIX_LENGTH" >> "$GITHUB_OUTPUT"

    - name: Read matrix
      id: set-matrix
      working-directory: ${{ github.workspace }}
      run: |
        MATRIX_JSON=$(cat matrix_output.json)
        echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
        MATRIX_LENGTH=$(echo $MATRIX_JSON | jq '.include | length')
        echo $MATRIX_LENGTH
        echo "length=$MATRIX_LENGTH" >> $GITHUB_OUTPUT

  build-ee:
    needs: [prepare-matrix]
    if: ${{ needs.prepare-matrix.outputs.length != '0' }}
    runs-on: ubuntu-latest
    environment: deploy
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Validate EE project eligibility
        env:
          EE_PROJECT: ${{ matrix.ee }}
        run: python3 .github/scripts/ee_projects.py check --project "$EE_PROJECT"

      - name: Fetch the base and head refs
        run: |
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}

      - name: Configure git credentials for private collections
        env:
          RHVP_OCP_LANDING_ZONE_TOKEN: ${{ secrets.RHVP_OCP_LANDING_ZONE_TOKEN }}
          RHVP_BAREMETAL_OCP_TOKEN: ${{ secrets.RHVP_BAREMETAL_OCP_TOKEN }}
        run: |
          git config --global \
            url."https://${RHVP_OCP_LANDING_ZONE_TOKEN}@github.com/heatmiser/rhvp.ocp_landing_zone".insteadOf \
            "https://github.com/heatmiser/rhvp.ocp_landing_zone"
          git config --global \
            url."https://${RHVP_BAREMETAL_OCP_TOKEN}@github.com/heatmiser/rhvp.baremetal_ocp".insteadOf \
            "https://github.com/heatmiser/rhvp.baremetal_ocp"

      - name: Install python requirements (ansible-builder)
        run: pip install -r requirements.txt

      - name: Define environment variables
        run: |
          echo "EE=${{ matrix.ee }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV

      - name: Log in to quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Log in to registry.redhat.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_USERNAME }}
          password: ${{ secrets.REDHAT_PASSWORD }}

      - name: Substitute token for automation hub
        run: |
          sed -i "s/my_ah_token/${{ secrets.AH_TOKEN }}/1" ansible.cfg

      - name: (devel) Build image and create artifact
        run: |
          echo "Would build: ${{ env.EE }}"

      - name: Build image and create artifact
        working-directory: ${{ matrix.ee }}
        run: |
          ansible-builder build -v 3 \
          --build-arg AH_TOKEN=${{ secrets.AH_TOKEN }} \
          --build-arg RHVP_OCP_LANDING_ZONE_TOKEN=${{ secrets.RHVP_OCP_LANDING_ZONE_TOKEN }} \
          --build-arg RHVP_BAREMETAL_OCP_TOKEN=${{ secrets.RHVP_BAREMETAL_OCP_TOKEN }} \
          --build-arg OCP_SATELLITE_TOKEN=${{ secrets.OCP_SATELLITE_TOKEN }} \
          --context=../${{ env.EE }} \
          --tag=${{ env.EE }}:${{ env.IMAGE_TAG }} \
          --tag=${{ env.EE }}:${{ github.sha }}

      - name: Generate bounded build report
        env:
          REPORT_LOCAL_IMAGE: ${{ env.EE }}:${{ env.IMAGE_TAG }}
          REPORT_REFERENCE: quay.io/${{ secrets.QUAY_USERNAME }}/${{ env.EE }}:${{ env.IMAGE_TAG }}
          REPORT_COMMIT: ${{ github.sha }}
          REPORT_OUTPUT: ${{ runner.temp }}/ci-report-${{ matrix.ee }}
        run: |
          python3 .github/scripts/ci_report.py --kind ee \
            --local-image "$REPORT_LOCAL_IMAGE" --reference "$REPORT_REFERENCE" \
            --commit "$REPORT_COMMIT" --output "$REPORT_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: commands-${{ matrix.ee }}
          path: ${{ runner.temp }}/ci-report-${{ matrix.ee }}/commands-${{ matrix.ee }}.txt
          retention-days: 30

      - name: Validate EE publication eligibility
        env:
          EE_PROJECT: ${{ matrix.ee }}
        run: python3 .github/scripts/ee_projects.py check --project "$EE_PROJECT"

      - name: Push To quay.io
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3
        with:
          image: ${{ env.EE }}
          tags: ${{ env.IMAGE_TAG }} ${{ github.sha }}
          registry: quay.io/${{ secrets.QUAY_USERNAME }}/
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Print summary
        run: |
          echo "## :rocket: Usage" >> $GITHUB_STEP_SUMMARY
          echo "Image pushed to repository: quay.io/${{ secrets.QUAY_USERNAME }}/${{ env.EE }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "> \`podman pull quay.io/${{ secrets.QUAY_USERNAME }}/${{ env.EE }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY

  build-ocp-ees:
    # Builds dcm-ocp-ee-4.x EEs after build-ee so dcm-base-ee:latest is available
    # on quay.io before the per-OCP EE layers pull it as their base_image.
    # Only runs when dcm-base-ee is in the generated matrix.
    needs: [prepare-matrix, build-ee]
    if: >-
      needs.build-ee.result == 'success' && contains(needs.prepare-matrix.outputs.matrix, 'dcm-base-ee')
      && needs.prepare-matrix.outputs.ocp_length != '0'
    runs-on: ubuntu-latest
    environment: deploy
    concurrency:
      group: ocp-ee-${{ matrix.ocp_version }}-production
      cancel-in-progress: false
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.ocp_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate dependent EE eligibility
        env:
          OCP_STREAM: ${{ matrix.ocp_version }}
        run: python3 .github/scripts/ocp_ee.py check-stream --stream "$OCP_STREAM"

      - name: Install python requirements (ansible-builder)
        run: pip install -r requirements.txt

      - name: Define environment variables
        run: |
          echo "EE=dcm-ocp-ee-${{ matrix.ocp_version }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV

      - name: Substitute quay username in base EE reference
        if: ${{ !matrix.versioned }}
        run: |
          sed -i "s/my_quay_username/${{ secrets.QUAY_USERNAME }}/1" \
            dcm-ocp-ee-${{ matrix.ocp_version }}/execution-environment.yml

      - name: Log in to quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Log in to registry.redhat.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_USERNAME }}
          password: ${{ secrets.REDHAT_PASSWORD }}

      - name: Substitute token for automation hub
        run: sed -i "s/my_ah_token/${{ secrets.AH_TOKEN }}/1" ansible.cfg

      - name: Build image
        if: ${{ !matrix.versioned }}
        working-directory: dcm-ocp-ee-${{ matrix.ocp_version }}
        run: |
          ansible-builder build -v 3 \
          --build-arg AH_TOKEN=${{ secrets.AH_TOKEN }} \
          --context=../dcm-ocp-ee-${{ matrix.ocp_version }} \
          --tag=${{ env.EE }}:${{ env.IMAGE_TAG }} \
          --tag=${{ env.EE }}:${{ github.sha }}

      - name: Build and verify configured stable OpenShift release
        if: matrix.versioned
        env:
          OCP_STREAM: ${{ matrix.ocp_version }}
          OCP_BASE: quay.io/${{ secrets.QUAY_USERNAME }}/dcm-base-ee:latest
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 .github/scripts/ocp_ee.py build \
            --release "stable-$OCP_STREAM" --base "$OCP_BASE" \
            --commit "$SOURCE_COMMIT" --run-id "$BUILD_ID" \
            --output "$RUNNER_TEMP/ocp-ee-$OCP_STREAM"

      - name: Publish verified OpenShift image
        if: matrix.versioned
        env:
          OCP_STREAM: ${{ matrix.ocp_version }}
          OCP_REGISTRY: quay.io/${{ secrets.QUAY_USERNAME }}
        run: |
          python3 .github/scripts/ocp_ee.py publish \
            --receipt "$RUNNER_TEMP/ocp-ee-$OCP_STREAM/receipt.json" --registry "$OCP_REGISTRY"

      - name: Preserve OpenShift build receipt
        if: always() && matrix.versioned
        uses: actions/upload-artifact@v4
        with:
          name: ocp-ee-${{ matrix.ocp_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocp-ee-${{ matrix.ocp_version }}/receipt.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Validate dependent EE publication eligibility
        env:
          OCP_STREAM: ${{ matrix.ocp_version }}
        run: python3 .github/scripts/ocp_ee.py check-stream --stream "$OCP_STREAM"

      - name: Push To quay.io
        if: ${{ !matrix.versioned }}
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3
        with:
          image: ${{ env.EE }}
          tags: ${{ env.IMAGE_TAG }} ${{ github.sha }}
          registry: quay.io/${{ secrets.QUAY_USERNAME }}/
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Print summary
        if: ${{ !matrix.versioned }}
        run: |
          echo "## :rocket: Usage" >> $GITHUB_STEP_SUMMARY
          echo "Image pushed to repository: quay.io/${{ secrets.QUAY_USERNAME }}/${{ env.EE }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "> \`podman pull quay.io/${{ secrets.QUAY_USERNAME }}/${{ env.EE }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
...
