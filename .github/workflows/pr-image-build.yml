---
name: Devel Image Build

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/scripts/ci_secrets.py'
      - 'tests/test_ci_secrets.py'
      - '**/Containerfile'
      - '**/image.yaml'
      - '**/*entrypoint.sh'
      - '**/README.md'
      - 'k8s-launch-kit/**'
      - '.github/scripts/ci_publication.py'
      - '.github/scripts/ci_report.py'
      - '.github/workflows/pr-image-build.yml'
      - '.github/workflows/push-image-build.yml'
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Plain-container project to build, or all five'
        required: true
        type: choice
        default: all
        options:
          - all
          - antigravity-ai-helpers
          - codex-ai-helpers
          - gemini-ai-helpers
          - opencode-ai-helpers
          - k8s-launch-kit

permissions:
  contents: read

jobs:
  prepare-matrix:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      length: ${{ steps.select.outputs.length }}
      commit: ${{ steps.select.outputs.commit }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate event and select images
        id: select
        run: |
          python3 .github/scripts/ci_publication.py prepare \
            --channel devel --output "$RUNNER_TEMP/plain-image-selection"

  build-image:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.length != '0' }}
    runs-on: ubuntu-latest
    environment: test
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    env:
      REGISTRY_AUTH_FILE: ${{ runner.temp }}/ee-auth-pr-image-build-build-image.json
    steps:
      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare-matrix.outputs.commit }}
          persist-credentials: false

      - name: Build, verify and scan image
        env:
          IMAGE_PROJECT: ${{ matrix.image }}
          CI_SECRET_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/ci_publication.py build \
            --project "$IMAGE_PROJECT" --channel devel \
            --output "$RUNNER_TEMP/plain-image-$IMAGE_PROJECT"

      - name: Check exact public files for credential values
        id: secret_files_0
        env:
          CI_SECRET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ci_secrets.py files \
            "${{ runner.temp }}/plain-image-${{ matrix.image }}/public/receipt.json" \
            "${{ runner.temp }}/plain-image-${{ matrix.image }}/public/report.txt" \
            "${{ runner.temp }}/plain-image-${{ matrix.image }}/public/SHA256SUMS"

      - name: Upload build artifact
        if: success() && steps.secret_files_0.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: image-checks-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/plain-image-${{ matrix.image }}/public/receipt.json
            ${{ runner.temp }}/plain-image-${{ matrix.image }}/public/report.txt
            ${{ runner.temp }}/plain-image-${{ matrix.image }}/public/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - name: Publish inspected image after hosted qualification
        # Build execution is enabled. Publication remains separately held.
        if: ${{ false }}
        env:
          CI_SECRET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PROJECT: ${{ matrix.image }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          python3 .github/scripts/ci_publication.py publish \
            --project "$IMAGE_PROJECT" --channel devel \
            --output "$RUNNER_TEMP/plain-image-$IMAGE_PROJECT"

      - name: Remove job registry authentication
        if: always()
        run: python3 .github/scripts/ci_secrets.py cleanup-auth

  post-comment:
    needs: build-image
    if: >-
      needs.build-image.result == 'success' && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Build job completed. Bounded check reports are available in the [workflow run](${runUrl}).`
            });
...
