name: Devel Image Build

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - '**/Containerfile'
      - '**/image.yaml'
      - '**/*entrypoint.sh'
      - '**/README.md'
      - 'k8s-launch-kit/**'
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      length: ${{ steps.set-matrix.outputs.length }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Generate matrix
      id: generate-matrix
      run: |
        echo $GITHUB_BASE_REF
        echo $GITHUB_HEAD_REF
        python -u .github/workflows/generate_image_matrix.py \
        --start-ref origin/$GITHUB_BASE_REF \
        --end-ref $GITHUB_HEAD_REF \
        --output-path matrix_output.json

    - name: Read matrix
      id: set-matrix
      run: |
        MATRIX_JSON=$(cat matrix_output.json)
        echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
        MATRIX_LENGTH=$(echo $MATRIX_JSON | jq '.include | length')
        echo $MATRIX_LENGTH
        echo "length=$MATRIX_LENGTH" >> $GITHUB_OUTPUT

  build-image:
    needs: [prepare-matrix]
    # Temporary gate while public output and comment publication are hardened.
    # Re-enable only after explicit review of the remaining publication paths.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: test
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Define environment variables
        run: |
          echo "IMAGE=${{ matrix.image }}" >> $GITHUB_ENV
          SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)
          echo "IMAGE_TAG=pr-${{ github.event.number }}-$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=ghcr.io" >> $GITHUB_ENV

      - name: Login to ghcr
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and create artifact
        if: matrix.image != 'k8s-launch-kit'
        working-directory: ${{ matrix.image }}
        run: |
          podman build \
          --tag=${{ env.IMAGE }}:${{ env.IMAGE_TAG }} \
          --tag=${{ env.IMAGE }}:${{ github.sha }} \
          .

      - name: Generate bounded build report
        if: matrix.image != 'k8s-launch-kit'
        env:
          REPORT_LOCAL_IMAGE: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          REPORT_REFERENCE: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha }}
          REPORT_OUTPUT: ${{ runner.temp }}/ci-report-${{ matrix.image }}
        run: |
          python3 .github/scripts/ci_report.py --kind image \
            --local-image "$REPORT_LOCAL_IMAGE" --reference "$REPORT_REFERENCE" \
            --commit "$REPORT_COMMIT" --output "$REPORT_OUTPUT"

      - name: Build and verify l8k image
        if: matrix.image == 'k8s-launch-kit'
        working-directory: k8s-launch-kit
        run: |
          ./ci-build.sh "$GITHUB_WORKSPACE/tmp/l8k-ci" "$IMAGE" "$IMAGE_TAG" "$GITHUB_SHA"

      - name: Upload l8k build evidence
        if: ${{ always() && matrix.image == 'k8s-launch-kit' }}
        uses: actions/upload-artifact@v4
        with:
          name: l8k-build-evidence
          path: |
            tmp/l8k-ci/public/receipt.json
            tmp/l8k-ci/public/summary.txt
            tmp/l8k-ci/public/commands-k8s-launch-kit.txt
            tmp/l8k-ci/public/SHA256SUMS
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: commands-${{ matrix.image }}
          path: ${{ matrix.image == 'k8s-launch-kit' && 'tmp/l8k-ci/public/commands-k8s-launch-kit.txt' || format('{0}/ci-report-{1}/commands-{1}.txt', runner.temp, matrix.image) }}
          retention-days: 7

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3
        with:
          image: ${{ env.IMAGE }}
          tags: ${{ env.IMAGE_TAG }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}

      - name: Print summary
        run: |
          echo "## :rocket: Usage" >> $GITHUB_STEP_SUMMARY
          echo "Image pushed to repository: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "> \`podman pull ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY

  post-comment:
    needs: build-image
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Build job completed. Bounded check reports are available in the [workflow run](${runUrl}).`
            });
