name: Devel EE Build

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - '**/execution-environment.yml'
      - '**/requirements.txt'
      - '**/requirements.yml'
      - '**/bindep.txt'
      - '**/customize.sh'
      - '**/ansible.cfg'
      - '**/ansible-collections.yml'
      - '**/python-packages.txt'
      - '**/system-packages.txt'
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest  
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      length: ${{ steps.set-matrix.outputs.length }}
      ocp_matrix: ${{ steps.ocp-matrix.outputs.matrix }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }} # exact commit

    - name: Generate matrix  
      id: generate-matrix
      run: |
        echo $GITHUB_BASE_REF
        echo $GITHUB_HEAD_REF
        python -u .github/workflows/generate_matrix.py \
        --start-ref origin/$GITHUB_BASE_REF \
        --end-ref $GITHUB_HEAD_REF \
        --output-path matrix_output.json

    - name: Prepare dependent OpenShift stream matrix
      id: ocp-matrix
      run: |
        MATRIX=$(python3 .github/scripts/ocp_ee.py automation-matrix)
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

    - name: Read matrix
      id: set-matrix
      run: |
        MATRIX_JSON=$(cat matrix_output.json)
        echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
        MATRIX_LENGTH=$(echo $MATRIX_JSON | jq '.include | length')
        echo $MATRIX_LENGTH
        echo "length=$MATRIX_LENGTH" >> $GITHUB_OUTPUT

  debug:
    needs: [prepare-matrix]
    if: ${{ needs.prepare-matrix.outputs.length != '0' }}
    runs-on: ubuntu-latest
    environment: test
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Print working directory
        run: pwd

      - name: List files in the directory
        run: ls -lah

      - name: List environment variables
        run: printenv

      - name: Show git branch and commit
        run: |
          echo "Current Branch:"
          git branch
          echo "Current Commit:"
          git rev-parse HEAD

      - name: Fetch all branches
        run: git fetch --all

      - name: List all remote branches
        run: git branch -r

      - name: Show detailed git diff
        run: git diff origin/main

  build-ee:
    needs: [prepare-matrix]
    if: ${{ needs.prepare-matrix.outputs.length != '0' }}
    outputs:
      push_success: ${{ steps.push_to_ghcr.outputs.push_success }}
    runs-on: ubuntu-latest
    environment: test
    strategy:
      matrix: ${{fromJson(needs.prepare-matrix.outputs.matrix)}}
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure git credentials for private collections
        env:
          RHVP_OCP_LANDING_ZONE_TOKEN: ${{ secrets.RHVP_OCP_LANDING_ZONE_TOKEN }}
          RHVP_BAREMETAL_OCP_TOKEN: ${{ secrets.RHVP_BAREMETAL_OCP_TOKEN }}
        run: |
          git config --global \
            url."https://${RHVP_OCP_LANDING_ZONE_TOKEN}@github.com/heatmiser/rhvp.ocp_landing_zone".insteadOf \
            "https://github.com/heatmiser/rhvp.ocp_landing_zone"
          git config --global \
            url."https://${RHVP_BAREMETAL_OCP_TOKEN}@github.com/heatmiser/rhvp.baremetal_ocp".insteadOf \
            "https://github.com/heatmiser/rhvp.baremetal_ocp"

      - name: Install python requirements (ansible-builder)
        run: pip install -r requirements.txt

      - name: Define environment variables
        run: |
          echo "EE=${{ matrix.ee }}" >> $GITHUB_ENV
          SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)
          echo "IMAGE_TAG=pr-${{ github.event.number }}-$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=ghcr.io" >> $GITHUB_ENV

      - name: Login to ghcr
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to registry.redhat.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_SA_USERNAME }}
          password: ${{ secrets.REDHAT_SA_PASSWORD }}

      - name: Substitute token for automation hub
        run: |
          sed -i "s/my_ah_token/${{ secrets.AH_TOKEN }}/g" ansible.cfg

      - name: Build image and create artifact
        working-directory: ${{ matrix.ee }}
        run: |
          ansible-builder build -v 3 \
          --build-arg AH_TOKEN=${{ secrets.AH_TOKEN }} \
          --build-arg RHVP_OCP_LANDING_ZONE_TOKEN=${{ secrets.RHVP_OCP_LANDING_ZONE_TOKEN }} \
          --build-arg RHVP_BAREMETAL_OCP_TOKEN=${{ secrets.RHVP_BAREMETAL_OCP_TOKEN }} \
          --build-arg OCP_SATELLITE_TOKEN=${{ secrets.OCP_SATELLITE_TOKEN }} \
          --context=../${{ env.EE }} \
          --tag=${{ env.EE }}:${{ env.IMAGE_TAG }} \
          --tag=${{ env.EE }}:${{ github.sha }}

      - name: Generate bounded build report
        env:
          REPORT_LOCAL_IMAGE: ${{ env.EE }}:${{ env.IMAGE_TAG }}
          REPORT_REFERENCE: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}/${{ env.EE }}:${{ env.IMAGE_TAG }}
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha }}
          REPORT_OUTPUT: ${{ runner.temp }}/ci-report-${{ matrix.ee }}
        run: |
          python3 .github/scripts/ci_report.py --kind ee \
            --local-image "$REPORT_LOCAL_IMAGE" --reference "$REPORT_REFERENCE" \
            --commit "$REPORT_COMMIT" --output "$REPORT_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: commands-${{ matrix.ee }}
          path: ${{ runner.temp }}/ci-report-${{ matrix.ee }}/commands-${{ matrix.ee }}.txt
          retention-days: 7

      - name: Push To GHCR
        id: push_to_ghcr
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3
        with:
          image: ${{ env.EE }}
          tags: ${{ env.IMAGE_TAG }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}

      - name: Set push success flag
        if: success()
        run: echo "push_success=true" >> $GITHUB_ENV

      - name: Print summary
        run: |
          echo "## :rocket: Usage" >> $GITHUB_STEP_SUMMARY
          echo "Image pushed to repository: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}/${{ env.EE }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "> \`podman pull ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}/${{ env.EE }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY

  build-ocp-ees:
    # Builds dcm-ocp-ee-4.x EEs after build-ee so dcm-base-ee is available.
    # Uses the PR-tagged dcm-base-ee image pushed by build-ee as the FROM layer.
    # Only runs when dcm-base-ee is in the generated matrix — the OCP EE builds
    # require a PR-tagged dcm-base-ee image which only exists when dcm-base-ee
    # was built in this CI run.
    needs: [prepare-matrix, build-ee]
    if: needs.build-ee.result == 'success' && contains(needs.prepare-matrix.outputs.matrix, 'dcm-base-ee')
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: ocp-ee-${{ matrix.ocp_version }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.ocp_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install python requirements (ansible-builder)
        run: pip install -r requirements.txt

      - name: Define environment variables
        run: |
          echo "EE=dcm-ocp-ee-${{ matrix.ocp_version }}" >> $GITHUB_ENV
          SHORT_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)
          echo "IMAGE_TAG=pr-${{ github.event.number }}-$SHORT_SHA" >> $GITHUB_ENV
          echo "BASE_EE_TAG=pr-${{ github.event.number }}-$SHORT_SHA" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=ghcr.io" >> $GITHUB_ENV

      - name: Substitute dcm-base-ee reference for PR build
        if: ${{ !matrix.versioned }}
        # Replace my_quay_username placeholder and :latest tag with the PR-tagged
        # dcm-base-ee pushed to ghcr.io by build-ee in this same workflow run.
        run: |
          sed -i "s|quay.io/my_quay_username/dcm-base-ee:latest|ghcr.io/${{ github.repository_owner }}/dcm-base-ee:${{ env.BASE_EE_TAG }}|g" \
            dcm-ocp-ee-${{ matrix.ocp_version }}/execution-environment.yml

      - name: Login to ghcr
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to registry.redhat.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_SA_USERNAME }}
          password: ${{ secrets.REDHAT_SA_PASSWORD }}

      - name: Substitute token for automation hub
        run: sed -i "s/my_ah_token/${{ secrets.AH_TOKEN }}/g" ansible.cfg

      - name: Build image
        if: ${{ !matrix.versioned }}
        working-directory: dcm-ocp-ee-${{ matrix.ocp_version }}
        run: |
          ansible-builder build -v 3 \
          --build-arg AH_TOKEN=${{ secrets.AH_TOKEN }} \
          --context=../dcm-ocp-ee-${{ matrix.ocp_version }} \
          --tag=${{ env.EE }}:${{ env.IMAGE_TAG }} \
          --tag=${{ env.EE }}:${{ github.sha }}

      - name: Build and verify configured stable OpenShift release
        if: matrix.versioned
        env:
          OCP_STREAM: ${{ matrix.ocp_version }}
          OCP_BASE: ghcr.io/${{ github.repository_owner }}/dcm-base-ee:${{ env.BASE_EE_TAG }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/ocp_ee.py build \
            --release "stable-$OCP_STREAM" --base "$OCP_BASE" \
            --commit "$SOURCE_COMMIT" --run-id "$BUILD_ID" --pr "$PR_NUMBER" \
            --output "$RUNNER_TEMP/ocp-ee-$OCP_STREAM"

      - name: Publish verified OpenShift image
        if: matrix.versioned
        env:
          OCP_STREAM: ${{ matrix.ocp_version }}
          OCP_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          python3 .github/scripts/ocp_ee.py publish \
            --receipt "$RUNNER_TEMP/ocp-ee-$OCP_STREAM/receipt.json" --registry "$OCP_REGISTRY"

      - name: Preserve OpenShift build receipt
        if: always() && matrix.versioned
        uses: actions/upload-artifact@v4
        with:
          name: ocp-ee-${{ matrix.ocp_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocp-ee-${{ matrix.ocp_version }}/receipt.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Push To GHCR
        if: ${{ !matrix.versioned }}
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3
        with:
          image: ${{ env.EE }}
          tags: ${{ env.IMAGE_TAG }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}

      - name: Print summary
        if: ${{ !matrix.versioned }}
        run: |
          echo "## OCP EE Built" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.IMAGE_REGISTRY }}/${{ github.repository_owner }}/${{ env.EE }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY

  post-comment:
    needs: build-ee
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Build job completed. Bounded check reports are available in the [workflow run](${runUrl}).`
            });
