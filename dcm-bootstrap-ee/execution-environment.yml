---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  galaxy: files/requirements.yml
  system: files/bindep.txt

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  prepend_base:
    # python3-cryptography (UBI 9 RPM, required by community.crypto bindep) depends on
    # python3-3.9, which changes /usr/bin/python3 from 3.12 → 3.9. Pre-install here so
    # assemble's bindep never triggers that symlink change mid-build. Restore symlink to
    # 3.12 immediately so ensurepip bootstraps pip for the correct interpreter.
    - "RUN microdnf install -y python3-cryptography && ln -sf /usr/bin/python3.12 /usr/bin/python3 && microdnf clean all"
    # AAP 2.6 base image ships ansible for Python 3.12 but removes pip post-install.
    # Use ensurepip (stdlib, no RPM) to bootstrap pip for $PYCMD without touching
    # system Python symlinks (microdnf python3-pip installs for Python 3.9 and
    # redirects /usr/bin/python3, breaking the ansible import check).
    - RUN $PYCMD -m ensurepip --upgrade && $PYCMD -m pip install --upgrade pip setuptools
    # openshift-clients stub — kubernetes.core bindep requires this package (rpm -q check).
    # A no-op RPM satisfies the check; kubernetes.core uses the Python client library at
    # runtime, not the oc binary, so no real binary is needed in this EE.
    - "RUN microdnf install -y rpm-build && { echo 'Name: openshift-clients'; echo 'Version: 0.0.0'; echo 'Release: 0'; echo 'Summary: OpenShift client tools stub'; echo 'License: ASL 2.0'; echo 'BuildArch: noarch'; echo ''; echo '%description'; echo 'Stub — satisfies kubernetes.core bindep check.'; echo ''; echo '%prep'; echo '%build'; echo '%install'; echo ''; echo '%files'; } > /tmp/oc.spec && rpmbuild --define '_topdir /tmp/rpmbuild' -bb /tmp/oc.spec && rpm -ivh /tmp/rpmbuild/RPMS/noarch/openshift-clients-0.0.0-0.noarch.rpm && microdnf remove -y rpm-build && microdnf clean all && rm -rf /tmp/rpmbuild /tmp/oc.spec"

  prepend_galaxy:
    # COLLECTION_TOKEN is the legacy broad-access secret passed by the base-branch
    # workflow during the pull_request_target transition. Per-repo tokens override it
    # once the new workflow lands on main.
    - ARG COLLECTION_TOKEN
    - ARG RHVP_OCP_LANDING_ZONE_TOKEN=${COLLECTION_TOKEN}
    - RUN git config --global url."https://${RHVP_OCP_LANDING_ZONE_TOKEN}@github.com/heatmiser/rhvp.ocp_landing_zone".insteadOf "https://github.com/heatmiser/rhvp.ocp_landing_zone"
    - ARG RHVP_BAREMETAL_OCP_TOKEN=${COLLECTION_TOKEN}
    - RUN git config --global url."https://${RHVP_BAREMETAL_OCP_TOKEN}@github.com/heatmiser/rhvp.baremetal_ocp".insteadOf "https://github.com/heatmiser/rhvp.baremetal_ocp"

  append_builder:
    # assemble removes pip as a cleanup step. Re-bootstrap it here so pip is present
    # in the builder stage's final filesystem state. COPY --from=builder in the
    # generated final stage captures that state, making pip available for
    # ansible-builder's dumb-init install. prepend_final is too early — it runs
    # before COPY --from=builder overwrites site-packages.
    - RUN $PYCMD -m ensurepip --upgrade

  append_final:
    - LABEL maintainer="Mike Savage"
    - LABEL quay.expires-after="45d"
...
