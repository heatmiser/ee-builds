---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  galaxy: files/requirements.yml
  system: files/bindep.txt

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  prepend_base:
    # AAP 2.6 base image ships ansible for Python 3.12 but removes pip post-install.
    # Use ensurepip (stdlib, no RPM) to bootstrap pip for $PYCMD without touching
    # system Python symlinks (microdnf python3-pip installs for Python 3.9 and
    # redirects /usr/bin/python3, breaking the ansible import check).
    - RUN $PYCMD -m ensurepip --upgrade && $PYCMD -m pip install --upgrade pip setuptools

  prepend_galaxy:
    # Inject COLLECTION_TOKEN for private heatmiser/rhvp.ocp_landing_zone collection
    - ARG COLLECTION_TOKEN
    - RUN git config --global url."https://${COLLECTION_TOKEN}@github.com/".insteadOf "https://github.com/" # zizmor: ignore[secrets-outside-env]

  prepend_final:
    # Re-bootstrap pip in the final stage. ensurepip in prepend_base installs pip
    # into the base layer, but the COPY --from=builder in the generated final stage
    # shadows site-packages, leaving pip absent when ansible-builder installs dumb-init.
    - RUN $PYCMD -m ensurepip --upgrade

  append_final:
    - LABEL maintainer="Mike Savage"
    - LABEL quay.expires-after="45d"
...
