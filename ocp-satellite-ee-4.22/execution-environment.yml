---
version: 3

images:
  base_image:
    # ee-minimal-rhel9: ansible-core only, no pre-installed collections.
    # Avoids inheriting transitive Python/system deps from the kitchen-sink
    # collections bundled in ee-supported-rhel9 (redhat.rhv, vmware, eda, etc.).
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  galaxy: files/requirements.yml
  python: files/requirements.txt
  system: files/bindep.txt

additional_build_files:
  - src: ansible.cfg
    dest: configs

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  prepend_base:
    # Install the Python 3.9 RPM dependency before restoring the base image's
    # Python 3.12 interpreter, so bindep cannot change it during assemble.
    - "RUN microdnf install -y python3-cryptography && ln -sf /usr/bin/python3.12 /usr/bin/python3 && microdnf clean all"
    # AAP 2.6 removes pip from the base image; bootstrap it for the interpreter
    # used by Ansible without installing the Python 3.9 python3-pip RPM.
    - RUN $PYCMD -m ensurepip --upgrade && $PYCMD -m pip install --upgrade pip setuptools
    # openshift-clients stub RPM — satisfies the kubernetes.core bindep check.
    # The real oc/kubectl/openshift-install binaries are host-level on the Arceus
    # bootc host (/usr/local/bin/); the EE does not need them for runtime tasks.
    # kubernetes.core modules use the Python kubernetes client library (not the oc
    # binary) for API calls, so only the stub RPM is needed here.
    - RUN microdnf install -y rpm-build && microdnf clean all
    - "RUN { echo 'Name: openshift-clients'; echo 'Version: 4.22.0'; echo 'Release: 0'; echo 'Summary: OpenShift client tools'; echo 'License: ASL 2.0'; echo 'BuildArch: noarch'; echo ''; echo '%description'; echo 'Stub package — satisfies kubernetes.core bindep check.'; echo ''; echo '%prep'; echo '%build'; echo '%install'; echo ''; echo '%files'; } > /tmp/oc.spec && rpmbuild --define \"_topdir /tmp/rpmbuild\" -bb /tmp/oc.spec && rpm -ivh /tmp/rpmbuild/RPMS/noarch/openshift-clients-4.22.0-0.noarch.rpm && microdnf remove -y rpm-build && microdnf clean all && rm -rf /tmp/rpmbuild /tmp/oc.spec"

  prepend_galaxy:
    # ansible.cfg configures galaxy_server_list: automation_hub (AH) + release_galaxy.
    - ADD _build/configs/ansible.cfg /etc/ansible/ansible.cfg

  append_builder:
    # assemble removes pip during cleanup. Restore it before the final stage
    # copies the builder filesystem and installs dumb-init.
    - RUN $PYCMD -m ensurepip --upgrade

  append_final:
    - LABEL maintainer="Mike Savage"
    - LABEL quay.expires-after="45d"
    - LABEL ocp.version="4.22"
