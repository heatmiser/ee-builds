---
version: 3

images:
  base_image:
    # dcm-base-ee provides all common collections, Python lockfile, and system packages.
    name: quay.io/my_quay_username/dcm-base-ee:latest

dependencies:
  galaxy: files/requirements.yml

options:
  package_manager_path: /usr/bin/microdnf

additional_build_files:
  # Staged and verified by .github/scripts/ocp_ee.py for one exact release.
  - src: files/release/openshift-client-linux.tar.gz
    dest: ocp-release
  - src: files/release/openshift-install-linux.tar.gz
    dest: ocp-release
  - src: files/release/SHA256SUMS
    dest: ocp-release

additional_build_steps:
  prepend_base:
    - ARG OCP_VERSION
    - RUN microdnf install -y rpm-build tar
    # Mount verified inputs only for extraction; archives never enter image layers.
    - >-
      RUN --mount=type=bind,source=_build/ocp-release,target=/tmp/ocp-release,ro
      test -n "$OCP_VERSION" && cd /tmp/ocp-release && sha256sum -c SHA256SUMS &&
      tar xzf openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl &&
      tar xzf openshift-install-linux.tar.gz -C /usr/local/bin openshift-install
    # Dependency metadata matches the selected tools; the base contains a 0.0.0 stub.
    - >-
      RUN { echo 'Name: openshift-clients'; echo "Version: $OCP_VERSION";
      echo 'Release: 0'; echo 'Summary: OpenShift client tools'; echo 'License: ASL 2.0';
      echo 'BuildArch: noarch'; echo ''; echo '%description';
      echo 'Stub package - satisfies kubernetes.core bindep check.'; echo '';
      echo '%prep'; echo '%build'; echo '%install'; echo ''; echo '%files';
      } > /tmp/oc.spec && rpmbuild --define "_topdir /tmp/rpmbuild" -bb /tmp/oc.spec &&
      rpm -Uvh /tmp/rpmbuild/RPMS/noarch/openshift-clients-${OCP_VERSION}-0.noarch.rpm &&
      rm -rf /tmp/rpmbuild /tmp/oc.spec

  append_final:
    - LABEL maintainer="Mike Savage"
    # The helper removes inherited expiry and verifies exact versions before publishing.
    - LABEL ocp.version="$OCP_VERSION"
...
